<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Y5 - Wutisilp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; background-color: #f8fafc; padding-bottom: 80px; }
        .pastel-OPER { background-color: #fce7f3; color: #be185d; border-color: #fbcfe8; }
        .pastel-PERIO { background-color: #dcfce7; color: #15803d; border-color: #bbf7d0; }
        .pastel-PROSTH { background-color: #e0f2fe; color: #0369a1; border-color: #bae6fd; }
        .pastel-PED1, .pastel-PED2 { background-color: #fef08a; color: #a16207; border-color: #fde047; }
        .pastel-OCC, .pastel-OPD\ OCC { background-color: #f3e8ff; color: #7e22ce; border-color: #e9d5ff; }
        .pastel-ENDO { background-color: #e0e7ff; color: #4338ca; border-color: #c7d2fe; }
        .pastel-ORTHO { background-color: #ffedd5; color: #c2410c; border-color: #fed7aa; }
        .pastel-SurgIN, .pastel-SurgOUT { background-color: #fee2e2; color: #b91c1c; border-color: #fecaca; }
        .pastel-X-RAY { background-color: #f3f4f6; color: #374151; border-color: #e5e7eb; }
        .pastel-DEFAULT { background-color: #f1f5f9; color: #334155; border-color: #e2e8f0; }
        
        .tab-btn.active { color: #3b82f6; font-weight: 600; }
        .tab-btn { color: #94a3b8; font-weight: 400; transition: all 0.2s; }
        .page-content { display: none; }
        .page-content.active { display: block; }
        textarea { resize: none; }
    </style>
</head>
<body>

    <div class="sticky top-0 bg-white/90 backdrop-blur-md z-10 border-b border-slate-200 px-4 py-3 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold text-slate-700">🦷 Clinic Life</h1>
        <span id="sync-status" class="text-[11px] text-slate-500 bg-slate-100 px-2 py-1 rounded-full font-medium flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse" id="sync-dot"></span> <span id="sync-text">กำลังโหลด...</span>
        </span>
    </div>

    <div class="max-w-xl mx-auto p-3">
        
        <!-- DASHBOARD -->
        <div id="page-dashboard" class="page-content active">
            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 mb-5">
                <div class="flex justify-between text-sm mb-2 text-slate-600 font-semibold">
                    <span id="progress-label">Progress</span>
                    <span id="progress-text" class="text-blue-600">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-blue-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div id="alert-container" class="mb-5 space-y-2"></div>

            <h2 class="text-base font-bold text-slate-700 mb-2 px-1">คลินิกสัปดาห์นี้</h2>
            <div id="this-week-list" class="space-y-3"></div>
        </div>

        <!-- ALL CLINICS -->
        <div id="page-all" class="page-content">
            <h2 class="text-base font-bold text-slate-700 mb-2 px-1">คลินิกทั้งหมด (เทอม 1 - เทอม 2)</h2>
            <div id="all-clinic-list" class="space-y-3"></div>
        </div>

        <!-- CASES -->
        <div id="page-cases" class="page-content">
            <div class="flex gap-2 mb-4">
                <div class="flex-1 bg-pink-50 p-3 rounded-xl border border-pink-100 flex flex-col items-center justify-center">
                    <span class="text-xs font-bold text-pink-600 uppercase tracking-wide">รวม Req (Oper)</span>
                    <span id="sum-req" class="text-2xl font-extrabold text-pink-500">0</span>
                </div>
                <div class="flex-1 bg-yellow-50 p-3 rounded-xl border border-yellow-100 flex flex-col items-center justify-center">
                    <span class="text-xs font-bold text-yellow-700 uppercase tracking-wide">รวม Credit (Ped)</span>
                    <span id="sum-credit" class="text-2xl font-extrabold text-yellow-600">0</span>
                </div>
            </div>

            <h2 class="text-base font-bold text-slate-700 mb-2 px-1">บันทึกเคสคลินิก</h2>
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 space-y-5">
                
                <div class="border-b pb-4">
                    <h3 class="font-bold text-pink-600 mb-3 flex items-center"><span class="text-lg mr-1">📝</span> OPER (หัตถการ)</h3>
                    <div class="space-y-3">
                        <div><label class="text-xs font-bold text-slate-600">Class I (5 ซี่)</label>
                        <textarea id="case-oper-class1" class="w-full text-sm p-2 border border-slate-200 rounded-lg bg-slate-50 focus:bg-white mt-1" rows="2" oninput="updateCaseData('oper-class1', this.value)"></textarea></div>
                        <div><label class="text-xs font-bold text-slate-600">Class II (20 surf)</label>
                        <textarea id="case-oper-class2" class="w-full text-sm p-2 border border-slate-200 rounded-lg bg-slate-50 focus:bg-white mt-1" rows="3" oninput="updateCaseData('oper-class2', this.value)"></textarea></div>
                        <div><label class="text-xs font-bold text-slate-600">Class III / IV (5 ซี่)</label>
                        <textarea id="case-oper-class3" class="w-full text-sm p-2 border border-slate-200 rounded-lg bg-slate-50 focus:bg-white mt-1" rows="2" oninput="updateCaseData('oper-class3', this.value)"></textarea></div>
                        <div><label class="text-xs font-bold text-slate-600">Class V (10 ซี่)</label>
                        <textarea id="case-oper-class5" class="w-full text-sm p-2 border border-slate-200 rounded-lg bg-slate-50 focus:bg-white mt-1" rows="2" oninput="updateCaseData('oper-class5', this.value)"></textarea></div>
                        <div><label class="text-xs font-bold text-slate-600">Treatment Plan / Recall</label>
                        <textarea id="case-oper-tx" class="w-full text-sm p-2 border border-slate-200 rounded-lg bg-slate-50 focus:bg-white mt-1" rows="2" oninput="updateCaseData('oper-tx', this.value)"></textarea></div>
                    </div>
                </div>

                <div class="border-b pb-4">
                    <h3 class="font-bold text-green-600 mb-3 flex items-center"><span class="text-lg mr-1">🪥</span> PERIO (ปริทันต์)</h3>
                    <div class="space-y-3">
                        <div><label class="text-xs font-bold text-slate-600">MS MG (6 เคส)</label>
                        <textarea id="case-perio-ms" class="w-full text-sm p-2 border border-slate-200 rounded-lg bg-slate-50 focus:bg-white mt-1" rows="3" oninput="updateCaseData('perio-ms', this.value)"></textarea></div>
                        <div class="grid grid-cols-2 gap-2">
                            <div><label class="text-xs font-bold text-slate-600">G (3 เคส)</label>
                            <textarea id="case-perio-g" class="w-full text-sm p-2 border border-slate-200 rounded-lg bg-slate-50 focus:bg-white mt-1" rows="2" oninput="updateCaseData('perio-g', this.value)"></textarea></div>
                            <div><label class="text-xs font-bold text-slate-600">P (1 เคส)</label>
                            <textarea id="case-perio-p" class="w-full text-sm p-2 border border-slate-200 rounded-lg bg-slate-50 focus:bg-white mt-1" rows="2" oninput="updateCaseData('perio-p', this.value)"></textarea></div>
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="font-bold text-blue-600 mb-3 flex items-center"><span class="text-lg mr-1">🦷</span> PROSTH (ประดิษฐ์)</h3>
                    <div><label class="text-xs font-bold text-slate-600">บันทึกเคสและงาน</label>
                    <textarea id="case-prosth" class="w-full text-sm p-2 border border-slate-200 rounded-lg bg-slate-50 focus:bg-white mt-1" rows="5" oninput="updateCaseData('prosth', this.value)"></textarea></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-around p-2 pb-safe shadow-[0_-4px_10px_-1px_rgba(0,0,0,0.05)]">
        <button onclick="switchTab('dashboard')" id="btn-dashboard" class="tab-btn active flex flex-col items-center w-20 py-1">
            <span class="text-xl mb-0.5 drop-shadow-sm">🏠</span>
            <span class="text-[10px] font-medium">สัปดาห์นี้</span>
        </button>
        <button onclick="switchTab('all')" id="btn-all" class="tab-btn flex flex-col items-center w-20 py-1">
            <span class="text-xl mb-0.5 drop-shadow-sm">📅</span>
            <span class="text-[10px] font-medium">ทั้งหมด</span>
        </button>
        <button onclick="switchTab('cases')" id="btn-cases" class="tab-btn flex flex-col items-center w-20 py-1">
            <span class="text-xl mb-0.5 drop-shadow-sm">🦷</span>
            <span class="text-[10px] font-medium">รวมเคส</span>
        </button>
    </div>

    <script>
        // 🚨 1. ใส่ URL ของ Web App ตรงนี้ 🚨
        const API_URL = 'https://script.google.com/macros/s/AKfycbwqH_5Mhe3meyFuzvVrG1wTbomTp6I9SCXV_SDgh6oGPRRwgQIKh1DDiKbTf1kkQIGP/exec'; 
        
        let appState = { schedule: [], cases: {} };

        function setStatus(text, colorClass) {
            document.getElementById('sync-text').textContent = text;
            document.getElementById('sync-dot').className = `w-2 h-2 rounded-full ${colorClass}`;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.page-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`page-${tabId}`).classList.add('active');
            document.getElementById(`btn-${tabId}`).classList.add('active');
            window.scrollTo(0,0);
        }

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if(data.schedule) appState = data;
                
                for (const [key, value] of Object.entries(appState.cases || {})) {
                    if(document.getElementById(`case-${key}`)) document.getElementById(`case-${key}`).value = value;
                }

                setStatus('อัปเดตล่าสุด', 'bg-green-500');
                renderApp();
            } catch (error) {
                setStatus('ออฟไลน์ (เชื่อมต่อไม่สำเร็จ)', 'bg-red-500');
            }
        }

        async function saveData() {
            setStatus('กำลังเซฟ...', 'bg-yellow-400 animate-pulse');
            try {
                // เปลี่ยน Content-Type เป็น text/plain เพื่อทะลวง Block CORS
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(appState)
                });
                setStatus('เซฟสำเร็จ', 'bg-green-500');
                calculateAutoSum();
            } catch (error) {
                setStatus('เซฟล้มเหลว', 'bg-red-500');
            }
        }

        let timeout = null;
        function updateData(id, field, value) {
            const index = appState.schedule.findIndex(item => item.id === id);
            if(index > -1) {
                appState.schedule[index][field] = value;
                clearTimeout(timeout);
                timeout = setTimeout(saveData, 1000);
            }
        }

        function updateCaseData(field, value) {
            if(!appState.cases) appState.cases = {};
            appState.cases[field] = value;
            clearTimeout(timeout);
            timeout = setTimeout(saveData, 1000);
        }

        function toggleCheckbox(id, field, isChecked) {
            const index = appState.schedule.findIndex(item => item.id === id);
            if(index > -1) {
                appState.schedule[index][field] = isChecked;
                renderApp(); 
                saveData();
            }
        }

        function getWorkingDaysDiff(targetDateStr) {
            const targetDate = new Date(targetDateStr);
            const today = new Date();
            today.setHours(0,0,0,0); targetDate.setHours(0,0,0,0);
            if(targetDate < today) return -1;
            
            let daysDiff = 0, current = new Date(today);
            while(current < targetDate) {
                current.setDate(current.getDate() + 1);
                if(current.getDay() !== 0 && current.getDay() !== 6) daysDiff++;
            }
            return daysDiff;
        }

        function calculateAutoSum() {
            const totalReq = appState.schedule.filter(i => i.clinic === 'OPER').reduce((sum, i) => sum + (parseFloat(i.req) || 0), 0);
            const totalCredit = appState.schedule.filter(i => i.clinic.startsWith('PED')).reduce((sum, i) => sum + (parseFloat(i.credit) || 0), 0);
            
            document.getElementById('sum-req').textContent = totalReq % 1 !== 0 ? totalReq.toFixed(1) : totalReq;
            document.getElementById('sum-credit').textContent = totalCredit % 1 !== 0 ? totalCredit.toFixed(1) : totalCredit;
        }

        function generateCardHTML(item) {
            const itemDate = new Date(item.date);
            const colorClass = `pastel-${item.clinic}` || 'pastel-DEFAULT';
            
            const daysTH = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัส', 'ศุกร์', 'เสาร์'];
            const dateStr = `${daysTH[itemDate.getDay()]} ${itemDate.getDate()}/${itemDate.getMonth()+1}/${(itemDate.getFullYear()+543).toString().slice(-2)} คาบ${item.period}`;
            
            let extraInputs = '';
            if(item.clinic === 'OPER') {
                extraInputs = `<input type="number" step="0.5" placeholder="Req" class="w-[60px] text-[13px] py-1.5 px-2 border border-white/60 rounded-lg bg-white/70 focus:bg-white text-center shadow-sm placeholder-slate-400 focus:outline-none" value="${item.req}" oninput="updateData('${item.id}', 'req', this.value)">`;
            } else if (item.clinic.startsWith('PED')) {
                extraInputs = `<input type="number" step="0.5" placeholder="Credit" class="w-[60px] text-[13px] py-1.5 px-2 border border-white/60 rounded-lg bg-white/70 focus:bg-white text-center shadow-sm placeholder-slate-400 focus:outline-none" value="${item.credit}" oninput="updateData('${item.id}', 'credit', this.value)">`;
            }

            // เงื่อนไขทำนัด: โชว์เฉพาะ 7 คลินิก
            const needsAppt = ['OPER', 'PERIO', 'PROSTH', 'OCC', 'OPD OCC', 'OPD PROSTH', 'ENDO', 'PED1', 'PED2'].includes(item.clinic);
            const apptCheckbox = needsAppt ? `
                <label class="flex items-center text-[13px] cursor-pointer font-medium">
                    <input type="checkbox" class="mr-1.5 w-4 h-4 text-blue-500 rounded border-slate-300 bg-white" ${item.apptDone ? 'checked' : ''} onchange="toggleCheckbox('${item.id}', 'apptDone', this.checked)">
                    <span class="${item.apptDone ? 'opacity-50 line-through' : 'text-slate-700'}">ทำนัด</span>
                </label>
            ` : '';

            // เงื่อนไขจองเครื่องมือ: เฉพาะ PROSTH, PERIO
            const isProsthPerio = (item.clinic === 'PROSTH' || item.clinic === 'PERIO');
            const dtisLink = isProsthPerio ? `<a href="http://dtis.dent.chula.ac.th/DentalEquipmentSystem" target="_blank" class="text-[11px] text-blue-600 underline ml-2 bg-blue-50/80 px-2 py-0.5 rounded-full border border-blue-100/50">ไปหน้าจอง</a>` : '';
            const toolCheckbox = isProsthPerio ? `
                <div class="flex items-center">
                    <label class="flex items-center text-[13px] cursor-pointer font-medium">
                        <input type="checkbox" class="mr-1.5 w-4 h-4 text-blue-500 rounded border-slate-300 bg-white" ${item.toolBooked ? 'checked' : ''} onchange="toggleCheckbox('${item.id}', 'toolBooked', this.checked)">
                        <span class="${item.toolBooked ? 'opacity-50 line-through' : 'text-slate-700'}">จองเครื่องมือ</span>
                    </label>
                    ${dtisLink}
                </div>` : '';

            const footerSection = (apptCheckbox || toolCheckbox) ? `
                <div class="flex flex-wrap items-center gap-x-5 gap-y-2 pt-2 border-t border-black/5 mt-1">
                    ${apptCheckbox}
                    ${toolCheckbox}
                </div>
            ` : '';

            return `
                <div class="rounded-xl border shadow-sm p-3 ${colorClass}">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <div class="text-[16px] font-bold text-slate-800 tracking-tight leading-tight">${dateStr}</div>
                            <h3 class="font-extrabold text-[13px] leading-tight mt-0.5 opacity-70">${item.clinic}</h3>
                        </div>
                        <div class="bg-white/80 px-2.5 py-1 rounded-lg text-[11px] font-bold border border-white/60 shadow-sm text-slate-700 shrink-0">
                            ยูนิต: ${item.unit || '-'}
                        </div>
                    </div>
                    
                    <div class="flex gap-2 mb-2">
                        <input type="text" placeholder="ระบุงานที่จะทำ..." class="w-full py-1.5 px-2.5 rounded-lg text-[13px] border border-white/60 bg-white/70 focus:bg-white focus:outline-none transition-colors text-slate-800 font-medium placeholder-slate-500 shadow-sm" value="${item.task}" oninput="updateData('${item.id}', 'task', this.value)">
                        ${extraInputs}
                    </div>

                    ${footerSection}
                </div>
            `;
        }

        function renderApp() {
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const next7Days = new Date(today);
            next7Days.setDate(today.getDate() + 7);

            let pastCount = 0;
            const totalClinics = appState.schedule.length || 137;
            const thisWeekEl = document.getElementById('this-week-list');
            const allClinicEl = document.getElementById('all-clinic-list');
            const alertEl = document.getElementById('alert-container');

            thisWeekEl.innerHTML = '';
            allClinicEl.innerHTML = '';
            alertEl.innerHTML = '';

            const sortedData = [...appState.schedule].sort((a,b) => new Date(a.date) - new Date(b.date));
            let currentWeekStr = "";

            sortedData.forEach(item => {
                const itemDate = new Date(item.date);
                itemDate.setHours(0,0,0,0);

                if(itemDate < today) pastCount++;
                else if (itemDate.getTime() === today.getTime() && item.period === 'เช้า' && new Date().getHours() >= 12) pastCount++;

                if((item.clinic === 'PROSTH' || item.clinic === 'PERIO') && !item.toolBooked) {
                    const workingDaysLeft = getWorkingDaysDiff(item.date);
                    if(workingDaysLeft >= 0 && workingDaysLeft <= 2) {
                        const daysTH = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัส', 'ศุกร์', 'เสาร์'];
                        const dateAlert = `${daysTH[itemDate.getDay()]} ${itemDate.getDate()}/${itemDate.getMonth()+1}/${(itemDate.getFullYear()+543).toString().slice(-2)} คาบ${item.period}`;
                        alertEl.innerHTML += `
                            <div class="bg-red-50 border border-red-200 text-red-700 p-3 rounded-xl text-sm flex items-center shadow-sm">
                                <span class="text-2xl mr-3 drop-shadow-sm">🚨</span> 
                                <div>
                                    <span class="font-bold block leading-tight">อย่าลืมจองเครื่องมือ ${item.clinic}</span>
                                    <span class="text-[12px] opacity-90">วันที่ ${dateAlert} | ยูนิต ${item.unit || '-'}</span>
                                </div>
                            </div>
                        `;
                    }
                }

                const cardHtml = generateCardHTML(item);
                
                // เส้นแบ่งสัปดาห์
                let itemMonday = new Date(itemDate);
                itemMonday.setDate(itemDate.getDate() - (itemDate.getDay() === 0 ? 6 : itemDate.getDay() - 1));
                let weekStr = itemMonday.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'});
                
                if(weekStr !== currentWeekStr) {
                    allClinicEl.innerHTML += `<div class="mt-6 mb-2 flex items-center"><div class="flex-grow border-t border-slate-300"></div><span class="px-3 text-[11px] font-bold text-slate-400 uppercase tracking-widest">สัปดาห์เริ่ม จันทร์ ${weekStr}</span><div class="flex-grow border-t border-slate-300"></div></div>`;
                    currentWeekStr = weekStr;
                }

                allClinicEl.innerHTML += cardHtml; 
                if(itemDate >= today && itemDate <= next7Days) thisWeekEl.innerHTML += cardHtml;
            });

            if(thisWeekEl.innerHTML === '') {
                thisWeekEl.innerHTML = `<div class="text-center p-6 text-slate-400 text-sm bg-slate-50 rounded-xl border border-dashed border-slate-200">ไม่มีคลินิกในช่วง 7 วันนี้ครับ 🎉</div>`;
            }

            document.getElementById('progress-label').textContent = `Progress (รวม ${totalClinics} คาบ)`;
            const progressPercent = totalClinics > 0 ? Math.round((pastCount / totalClinics) * 100) : 0;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('progress-text').textContent = `${progressPercent}% (${pastCount}/${totalClinics})`;

            calculateAutoSum();
        }

        window.onload = loadData;
    </script>
</body>
</html>
