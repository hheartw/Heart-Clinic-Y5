<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart's Clinic Planner</title>
    <!-- ใช้ Tailwind CSS สำหรับความ Clean & Pastel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ใช้ Font Noto Sans Thai -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; background-color: #f8fafc; }
        .pastel-OPER { background-color: #fce7f3; color: #be185d; border-color: #fbcfe8; }
        .pastel-PERIO { background-color: #dcfce7; color: #15803d; border-color: #bbf7d0; }
        .pastel-PROSTH { background-color: #e0f2fe; color: #0369a1; border-color: #bae6fd; }
        .pastel-PED1, .pastel-PED2 { background-color: #fef08a; color: #a16207; border-color: #fde047; }
        .pastel-OCC { background-color: #f3e8ff; color: #7e22ce; border-color: #e9d5ff; }
        .pastel-DEFAULT { background-color: #f1f5f9; color: #334155; border-color: #e2e8f0; }
    </style>
</head>
<body class="pb-20">

    <div class="max-w-xl mx-auto p-4">
        <!-- Header & Sync Status -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-700">🦷 Clinic Life</h1>
            <span id="sync-status" class="text-xs text-slate-400 bg-slate-100 px-2 py-1 rounded-full">ดึงข้อมูลล่าสุด...</span>
        </div>

        <!-- Overall Progress -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 mb-6">
            <div class="flex justify-between text-sm mb-2 text-slate-600 font-semibold">
                <span>Progress คลินิกทั้งหมด</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-3">
                <div id="progress-bar" class="bg-blue-400 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- Alert Area -->
        <div id="alert-container" class="mb-6 space-y-2"></div>

        <!-- Clinics List -->
        <h2 class="text-lg font-semibold text-slate-700 mb-3">คลินิกที่กำลังจะมาถึง</h2>
        <div id="clinic-list" class="space-y-4">
            <!-- Cards จะถูกสร้างจาก JS -->
        </div>
    </div>

    <script>
        // 1. ใส่ URL ของ Web App ที่ได้จาก Apps Script ตรงนี้ !!!
        const API_URL = 'ใส่_URL_ของ_APPS_SCRIPT_ที่นี่'; 
        
        // ข้อมูลตัวอย่าง (ถ้าโหลดจาก API ไม่ได้ หรือเพิ่งเริ่มใช้ครั้งแรก)
        let scheduleData = [
            { id: "1", date: "2026-09-22", period: "เช้า", clinic: "PERIO", unit: "13-34", task: "ประเสริฐ ScRP", req: "", credit: "", apptDone: true, toolBooked: false },
            { id: "2", date: "2026-09-22", period: "บ่าย", clinic: "PROSTH", unit: "-", task: "สุปราณี", req: "", credit: "", apptDone: false, toolBooked: false },
            { id: "3", date: "2026-09-23", period: "เช้า", clinic: "OPER", unit: "12-36", task: "อรมนัส", req: "", credit: "", apptDone: false, toolBooked: false }
        ];

        // --- Functions --- //

        // ดึงข้อมูลจาก Backend
        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                if(data && data.length > 0) scheduleData = data;
                document.getElementById('sync-status').textContent = '✅ ซิงค์แล้ว';
                renderApp();
            } catch (error) {
                document.getElementById('sync-status').textContent = '⚠️ ออฟไลน์';
                renderApp(); // ใช้ข้อมูล default หรือข้อมูลที่ค้างใน memory ไปก่อน
            }
        }

        // เซฟข้อมูลไป Backend
        async function saveData() {
            document.getElementById('sync-status').textContent = '⏳ กำลังเซฟ...';
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(scheduleData)
                });
                document.getElementById('sync-status').textContent = '✅ เซฟแล้ว';
                renderApp(); // Rerender เพื่ออัปเดต Progress/Alert
            } catch (error) {
                document.getElementById('sync-status').textContent = '❌ เซฟล้มเหลว';
            }
        }

        // Event listener สำหรับแก้ไขข้อมูล (Debounce)
        let timeout = null;
        function updateData(id, field, value) {
            const index = scheduleData.findIndex(item => item.id === id);
            if(index > -1) {
                scheduleData[index][field] = value;
                clearTimeout(timeout);
                timeout = setTimeout(saveData, 800); // รอพิมพ์เสร็จ 0.8 วิค่อยเซฟ
            }
        }

        function toggleCheckbox(id, field, isChecked) {
            const index = scheduleData.findIndex(item => item.id === id);
            if(index > -1) {
                scheduleData[index][field] = isChecked;
                saveData(); // ติ๊กปุ๊บเซฟปั๊บ
            }
        }

        // คำนวณวันทำการ (หักเสาร์-อาทิตย์)
        function getWorkingDaysDiff(targetDateStr) {
            const targetDate = new Date(targetDateStr);
            const today = new Date();
            today.setHours(0,0,0,0);
            targetDate.setHours(0,0,0,0);
            
            let daysDiff = 0;
            let current = new Date(today);
            
            if(targetDate < today) return -1; // ผ่านไปแล้ว
            
            while(current < targetDate) {
                current.setDate(current.getDate() + 1);
                if(current.getDay() !== 0 && current.getDay() !== 6) { // ไม่ใช่อาทิตย์(0) และเสาร์(6)
                    daysDiff++;
                }
            }
            return daysDiff;
        }

        // สร้างหน้าจอ
        function renderApp() {
            const listEl = document.getElementById('clinic-list');
            const alertEl = document.getElementById('alert-container');
            const today = new Date();
            today.setHours(0,0,0,0);

            listEl.innerHTML = '';
            alertEl.innerHTML = '';
            
            let pastCount = 0;
            let totalCount = scheduleData.length;

            // Sort วันที่
            const sortedData = [...scheduleData].sort((a,b) => new Date(a.date) - new Date(b.date));

            sortedData.forEach(item => {
                const itemDate = new Date(item.date);
                itemDate.setHours(0,0,0,0);

                // --- คำนวณ Progress ---
                if(itemDate < today) pastCount++;
                else if (itemDate.getTime() === today.getTime() && item.period === 'เช้า' && new Date().getHours() >= 12) pastCount++;

                // --- แจ้งเตือนจองเครื่องมือ (เฉพาะ Prosth, Perio ล่วงหน้าไม่เกิน 2 วันทำการ) ---
                if((item.clinic === 'PROSTH' || item.clinic === 'PERIO') && !item.toolBooked) {
                    const workingDaysLeft = getWorkingDaysDiff(item.date);
                    if(workingDaysLeft >= 0 && workingDaysLeft <= 2) {
                        // รูปแบบวันที่ภาษาไทย
                        const dateStr = itemDate.toLocaleDateString('th-TH', {day:'numeric', month:'short'});
                        alertEl.innerHTML += `
                            <div class="bg-red-50 border border-red-200 text-red-600 p-3 rounded-lg text-sm flex items-center shadow-sm">
                                <span class="text-xl mr-2">🚨</span> 
                                <div>
                                    <span class="font-bold">อย่าลืมจองเครื่องมือ ${item.clinic}</span><br>
                                    วันที่ ${dateStr} ${item.period} | ยูนิต ${item.unit}
                                </div>
                            </div>
                        `;
                    }
                }

                // --- แสดงการ์ดเฉพาะวันนี้ และอนาคต ---
                if(itemDate >= today) {
                    const colorClass = `pastel-${item.clinic}` || 'pastel-DEFAULT';
                    const dateStr = itemDate.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'});
                    
                    let extraInputs = '';
                    if(item.clinic === 'OPER') {
                        extraInputs = `<input type="text" placeholder="Req" class="w-20 text-sm p-1 border rounded bg-white" value="${item.req}" oninput="updateData('${item.id}', 'req', this.value)">`;
                    } else if (item.clinic.startsWith('PED')) {
                        extraInputs = `<input type="text" placeholder="Credit" class="w-20 text-sm p-1 border rounded bg-white" value="${item.credit}" oninput="updateData('${item.id}', 'credit', this.value)">`;
                    }

                    const dtisLink = (item.clinic === 'PROSTH' || item.clinic === 'PERIO') 
                        ? `<a href="http://dtis.dent.chula.ac.th/DentalEquipmentSystem" target="_blank" class="text-xs text-blue-500 underline ml-2">ไปหน้าจอง</a>` 
                        : '';

                    listEl.innerHTML += `
                        <div class="rounded-xl border shadow-sm p-4 ${colorClass}">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h3 class="font-bold text-lg">${item.clinic}</h3>
                                    <p class="text-xs opacity-80">${dateStr} (${item.period})</p>
                                </div>
                                <div class="bg-white/60 px-3 py-1 rounded-full text-sm font-semibold border border-white/50 shadow-sm">
                                    ยูนิต: ${item.unit}
                                </div>
                            </div>
                            
                            <div class="mt-3">
                                <label class="text-xs font-semibold opacity-80">งานที่จะทำ</label>
                                <input type="text" class="w-full p-2 mt-1 rounded-lg text-sm border-white/50 bg-white/80 focus:outline-none" value="${item.task}" oninput="updateData('${item.id}', 'task', this.value)">
                            </div>

                            <div class="mt-3 flex items-center space-x-2">
                                ${extraInputs}
                            </div>

                            <div class="mt-4 flex flex-col space-y-2">
                                <label class="flex items-center text-sm cursor-pointer">
                                    <input type="checkbox" class="mr-2 w-4 h-4 rounded text-blue-500" ${item.apptDone ? 'checked' : ''} onchange="toggleCheckbox('${item.id}', 'apptDone', this.checked)">
                                    ทำนัดแล้ว
                                </label>
                                <label class="flex items-center text-sm cursor-pointer">
                                    <input type="checkbox" class="mr-2 w-4 h-4 rounded text-blue-500" ${item.toolBooked ? 'checked' : ''} onchange="toggleCheckbox('${item.id}', 'toolBooked', this.checked)">
                                    จองเครื่องมือแล้ว ${dtisLink}
                                </label>
                            </div>
                        </div>
                    `;
                }
            });

            // อัปเดต Progress
            const progressPercent = totalCount === 0 ? 0 : Math.round((pastCount / totalCount) * 100);
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('progress-text').textContent = `${progressPercent}% (${pastCount}/${totalCount})`;
        }

        // Initial load
        window.onload = loadData;

    </script>
</body>
</html>
